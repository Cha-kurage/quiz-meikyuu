<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz迷宮</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <!-- 1600x900 の固定ステージを画面に合わせて拡縮する (PC / スマホ横向き共通) -->
  <!-- 石板・パーツ・解答ゾーンは常に表示。早押しボタンは押すたびに出題の一時停止/再開を切り替える -->
  <div id="stage">

    <button id="menu-btn" class="ui-btn" type="button" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>

    <!-- 9問目で背景から壁を取り出した跡。外の草原と鉄格子が見える (drag.js) -->
    <div id="wall-hole" hidden></div>

    <!-- 左: 出題ゾーン -->
    <section id="question-zone" aria-label="出題ゾーン">
      <div id="question-number"></div> <!-- 上に小さく出す問題番号 (常に表示) -->
      <div id="question-timer"></div>  <!-- 左上のタイマー。正解済みなら記録 (quiz.js) -->
      <div id="question-text"></div>
      <div id="question-status"></div>
    </section>

    <!-- 出題ゾーン下部: 早押しボタン。問題を開いたら、押されるまで上に吹き出しを出して待つ (quiz.js) -->
    <div id="buzzer-hint" hidden>ボタンを押して出題</div>
    <button id="buzzer-btn" type="button" aria-label="早押しボタン">
      <img src="assets/images/ui/buzzer.png" alt="" draggable="false">
    </button>

    <!-- 右: パーツ置き場 (石板) -->
    <section id="parts-tablet" class="tablet" aria-label="パーツ置き場"></section>

    <!-- 右下: 解答ゾーン -->
    <section id="answer-zone" aria-label="解答ゾーン"></section>

    <!-- パーツ (ステージ座標で配置。石板と解答ゾーンの上をドラッグで移動できる) -->
    <div id="parts-layer"></div>

    <!-- 本編の答え: 偽天狗が早押しボタンの横に出て言う (quiz.js)。正解すると消える -->
    <div id="answer-tengu" hidden>
      <img src="assets/images/tengu/nise_tengu.png" alt="" draggable="false">
      <div class="at-bubble"><div>答えは</div><div class="at-answer-line"><span class="tut-answer"></span><span class="tut-reading"></span></div><div>である</div></div>
    </div>

    <button id="submit-btn" type="button">これで回答</button>
    <div id="answer-mark"></div>
    <div id="answer-result"></div>

    <!-- チュートリアル: 偽天狗がしゃべる (tutorial.js) -->
    <div id="tutorial" hidden>
      <img id="tut-tengu" src="assets/images/tengu/nise_tengu.png" alt="案内役の天狗" draggable="false">
      <div id="tut-bubble">
        <div id="tut-text"></div>
        <div id="tut-buttons">
          <button id="tut-next" type="button">次へ ▶</button>
          <!-- 「説明をもう一度見る」で聞くときだけ出す (tutorial.js) -->
          <button id="tut-yes" type="button" hidden>はい</button>
          <button id="tut-no" type="button" hidden>いいえ</button>
        </div>
      </div>
      <!-- チュートリアルをスキップ: メニューのボタンの右に小さく (2026-11-27 ユーザー指示。チュートリアル中だけ出す) -->
      <button id="tut-skip" type="button" hidden>スキップ ▶▶</button>
    </div>

    <!-- メニュー (左上の三本線で開く。menu.js) -->
    <div id="menu-panel" class="overlay" hidden>
      <div class="panel-box menu-box" role="dialog" aria-label="メニュー">
        <div class="panel-title">メニュー</div>
        <button class="menu-item" type="button" data-menu="volume">音量の調節</button>
        <button class="menu-item" type="button" data-menu="tutorial">説明をもう一度見る</button>
        <button class="menu-item menu-close" type="button" data-menu="close">閉じる</button>
      </div>
    </div>

    <!-- 音量の調節: 天狗の鼻 (180度回転) の上のつまみを左右に動かす。小さいと青、大きいと赤 (menu.js) -->
    <!-- 鼻の左のベルは、ドラッグすると答えのパーツとして取り出せる (main.js の renderVolumeBellPart / drag.js) -->
    <div id="volume-panel" class="overlay" hidden>
      <div class="panel-box volume-box" role="dialog" aria-label="音量の調節">
        <div class="panel-title">音量</div>
        <div id="volume-row">
          <img id="volume-bell" src="assets/images/parts/illust_bell.png" alt="" draggable="false">
          <div id="volume-track">
            <img id="volume-nose" src="assets/images/tengu/tengu_nose.png" alt="" draggable="false">
            <div id="volume-knob" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
        <div id="volume-value">50</div>
        <button id="volume-close" class="menu-item menu-close" type="button">閉じる</button>
      </div>
    </div>

    <!-- 開発用の「正解を並べる」「座標を調べる」は外した (2026-11-20 ユーザー指示)。
         また使うときは、このコメントと下の script のコメントを外す
    <button id="debug-solve-btn" type="button">正解を並べる</button>
    <button id="debug-coords-btn" type="button">座標を調べる</button>
    <pre id="debug-coords-panel" hidden></pre>
    -->

    <!-- 左下: 戻る / 右下: 進む -->
    <button id="prev-btn" class="nav-btn" type="button">◀ 戻る</button>
    <button id="next-btn" class="nav-btn" type="button">進む ▶</button>

    <!-- 迷宮の門: 最初 (ページを開いたとき) と最後 (16問目に正解したとき) に開く (gate.js) -->
    <div id="gate" class="closed" hidden>
      <div class="gate-light"></div>
      <div class="gate-message">
        <div class="gate-message-title">迷宮の門が開いた！</div>
        <div class="gate-message-sub">全問クリア、おめでとう！</div>
        <!-- クリア後: 「あなたの早押しクイズ力」の画像と、保存・ポスト・閉じる (gate.js / rank.js) -->
        <img id="gate-rank-img" alt="あなたの早押しクイズ力" draggable="false">
        <div class="gate-rank-hint">スマホは画像を長押しして保存できます</div>
        <div class="gate-actions">
          <a id="gate-save" class="gate-action" download="quiz-meikyu-hayaoshi.png" href="#">画像を保存</a>
          <button id="gate-post" class="gate-action gate-action-post" type="button">ネタバレのない感想をポスト</button>
          <button id="gate-close" class="gate-action" type="button">閉じる</button>
        </div>
      </div>
      <div class="gate-doors">
        <div class="gate-door gate-door-left"><div class="gate-band top"></div><div class="gate-band bottom"></div><div class="gate-ring"></div></div>
        <div class="gate-door gate-door-right"><div class="gate-band top"></div><div class="gate-band bottom"></div><div class="gate-ring"></div></div>
      </div>
      <div class="gate-lintel"><div class="gate-plate">Quiz迷宮</div></div>
      <button id="gate-open" class="gate-btn" type="button">門を開ける</button>
    </div>

  </div>

  <!-- 最初の門を開ける画面で、スマホにだけ「横向きに」と出す (gate.js、CSS #rotate-hint) -->
  <div id="rotate-hint" hidden><div class="rotate-phone"></div><div>スマホは横向きにして<br>お楽しみください</div></div>

  <script src="src/js/parts.js"></script>
  <script src="src/js/main.js"></script>
  <script src="src/js/sound.js"></script>
  <script src="src/js/questions.js"></script>
  <script src="src/js/drag.js"></script>
  <script src="src/js/answers.js"></script>
  <script src="src/js/quiz.js"></script>
  <script src="src/js/menu.js"></script>
  <script src="src/js/rank.js"></script>
  <script src="src/js/gate.js"></script>
  <script src="src/js/tutorial.js"></script>
  <!-- 開発用 (今は外している。上のボタンと一緒にコメントを外すと使える)
  <script src="src/js/debug-coords.js"></script>
  <script src="src/js/debug-solve.js"></script>
  -->
</body>
</html>
